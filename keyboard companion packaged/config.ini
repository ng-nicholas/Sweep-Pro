# Sweep Pro uses the BLE-embedded layer report (CONFIG_ZMK_LAYER_STATUS_BLE_HID).
# Run the companion with --ble. The USB_HID section below is unused because the
# USB raw-HID method (CONFIG_ZMK_LAYER_STATUS_USB_HID) is disabled in firmware.

[KEYBOARD_USB_HID]
# Unused for Sweep Pro (USB raw-HID method disabled). Left at ZMK defaults.
usage_page = 0xFF60
usage = 0x61

[KEYBOARD_BLE_HID]
# ZMK default identifiers (Sweep Pro does not override USB_DEVICE_VID/PID).
vendor_id = 0x1D50
product_id = 0x615E

[LAYER_IMAGES]
# Image files location: ./assets/
# Sweep Pro keymap layer order (from config/sweep.keymap):
#   0 win, 1 mac, 2 nav, 3 sym, 4 extsym, 5 num, 6 func, 7 controls, 8 hardware
# Generated from the real keymap by tools/generate_layer_images.py
layer_0 = sweep-win.png
layer_1 = sweep-mac.png
layer_2 = sweep-nav.png
layer_3 = sweep-sym.png
layer_4 = sweep-extsym.png
layer_5 = sweep-num.png
layer_6 = sweep-func.png
layer_7 = sweep-controls.png
layer_8 = sweep-hardware.png
